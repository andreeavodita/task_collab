<!DOCTYPE html>
<html>
<head>
    <title>CORS Test</title>
</head>
<body>
<button onclick="callApi()">Call API</button>

<script>
    function callApi() {
        fetch("http://localhost:8080/lists", {
            method: "GET",
            headers: {
                "Content-Type": "application/json"
            }
        })
        .then(res => res.json())
        .then(data => console.log("SUCCESS:", data))
        .catch(err => console.error("ERROR:", err));
    }
</script>
</body>
</html>
